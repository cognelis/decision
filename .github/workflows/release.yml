name: Native release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install vetted native build runtime
        run: npm run setup:build-runtime
      - name: Run the complete quality gate
        run: npm run quality
      - name: Audit shipped dependencies
        run: npm run audit:runtime
      - name: Audit release portability and workflow policy
        run: npx vitest run scripts/test/release-portability.test.ts scripts/test/release-workflow.test.ts

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install vetted native build runtime
        run: npm run setup:build-runtime
      - name: Verify Windows historical and pending-state migration
        run: npx vitest run apps/desktop/test/brand-migration.test.ts
      - name: Build Windows x64 installer
        run: npm run make -- --platform=win32 --arch=x64
      - name: Install and smoke test the final Windows Setup
        shell: pwsh
        run: ./scripts/smoke-installed-windows.ps1
      - name: Verify Windows release artifact
        if: github.ref_type != 'tag'
        run: node scripts/release-artifact.mjs --platform=win32 --arch=x64
      - name: Verify tagged Windows release artifact
        if: github.ref_type == 'tag'
        run: node scripts/release-artifact.mjs --platform=win32 --arch=x64 --require-tag
      - name: Upload verified Windows files
        uses: actions/upload-artifact@v7
        with:
          name: decision-win32-x64-${{ github.sha }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install vetted native build runtime
        run: npm run setup:build-runtime
      - name: Build Apple Silicon application
        run: npm run make -- --platform=darwin --arch=arm64
      - name: Smoke test packaged macOS application
        run: npm run smoke
      - name: Verify macOS release artifact
        if: github.ref_type != 'tag'
        run: node scripts/release-artifact.mjs --platform=darwin --arch=arm64
      - name: Verify tagged macOS release artifact
        if: github.ref_type == 'tag'
        run: node scripts/release-artifact.mjs --platform=darwin --arch=arm64 --require-tag
      - name: Upload verified macOS files
        uses: actions/upload-artifact@v7
        with:
          name: decision-darwin-arm64-${{ github.sha }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [quality, build-windows, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download both native release sets
        uses: actions/download-artifact@v8
        with:
          path: out/final-release
          merge-multiple: true
      - name: Verify the complete release set
        run: node scripts/verify-release-set.mjs --directory=out/final-release --tag=${{ github.ref_name }} --source-commit=${{ github.sha }}
      - name: Publish an exact atomic GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              mkdir -p out/published-release
              gh release download "$GITHUB_REF_NAME" --dir out/published-release
              node scripts/verify-release-set.mjs --directory=out/published-release --version="$VERSION" --tag="$GITHUB_REF_NAME" --source-commit="$GITHUB_SHA"
              echo "Release $GITHUB_REF_NAME is already published and remains immutable."
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Decision $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi

          mapfile -t EXISTING_ASSETS < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for ASSET in "${EXISTING_ASSETS[@]}"; do
            gh release delete-asset "$GITHUB_REF_NAME" "$ASSET" --yes
          done
          gh release upload "$GITHUB_REF_NAME" out/final-release/*

          mkdir -p out/uploaded-release
          gh release download "$GITHUB_REF_NAME" --dir out/uploaded-release
          node scripts/verify-release-set.mjs --directory=out/uploaded-release --version="$VERSION" --tag="$GITHUB_REF_NAME" --source-commit="$GITHUB_SHA"
          gh release edit "$GITHUB_REF_NAME" --title "Decision $GITHUB_REF_NAME" --notes-file docs/release-notes.md --draft=false
